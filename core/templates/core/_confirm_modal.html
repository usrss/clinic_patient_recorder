<!-- Generic Confirmation Modal (for data-confirm forms) -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 shadow" style="border-radius:16px;">
      <div class="modal-body text-center p-4">
        <div style="width:40px;height:40px;border-radius:50%;background:#fef2f2;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
          <svg width="20" height="20" fill="none" stroke="#ef4444" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <h5 style="font-weight:700;margin-bottom:4px;">Are you sure?</h5>
        <p id="confirmModalMessage" style="font-size:13px;color:#6b7280;margin-bottom:20px;">This action cannot be undone.</p>
        <div style="display:flex;gap:8px;justify-content:center;">
          <button type="button" id="confirmModalCancel" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" style="border-radius:8px;min-width:80px;">Cancel</button>
          <button type="button" id="confirmModalBtn" class="btn btn-danger btn-sm" style="border-radius:8px;min-width:80px;">Confirm</button>
        </div>
      </div>
    </div>
  </div>
</div>

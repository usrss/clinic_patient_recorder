upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # ── Maximum upload size (profile pictures + logos) ──────────────────
    client_max_body_size 10M;

    # ── Gzip compression for static assets ──────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # ── Static files (collected via `collectstatic`) ────────────────────
    location /static/ {
        alias /app/staticfiles/;
        # Soft cache: files are served with un-hashed names, so a long-lived
        # "immutable" cache left browsers stuck on old JS/CSS after deploys
        # (e.g. the register.js regression). Revalidate on every load instead
        # (304 Not Modified when unchanged) so updates reach browsers quickly.
        # Switch back to `expires 30d; immutable` only if you adopt hashed
        # static filenames (ManifestStaticFilesStorage).
        etag on;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── Media files (profile pictures, logos) ───────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        # must-revalidate ensures the browser checks for a newer version after
        # the expiry time (e.g. if a user updates their profile picture).
        add_header Cache-Control "public, must-revalidate";
    }

    # ── All other requests → Django / Gunicorn ──────────────────────────
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}

# ── Docker Compose for local-network deployment ────────────────────────────
# Three services: MySQL 8, Redis 7, Django/Gunicorn.
# Plus nginx as a reverse proxy that serves static files and media files
# (profile pictures, logos) for better performance.
#
# First-time setup (after copying .env.example -> .env and editing values):
#
#   1. docker compose build          # Build the web image
#   2. docker compose up -d          # Start all services in background
#   3. docker compose exec web python manage.py migrate
#   4. docker compose exec web python manage.py createsuperuser
#                                   # → Access at http://<server-ip>:80
#
# Subsequent starts:
#   docker compose up -d
#
# Stop:       docker compose down
# Stop+clean: docker compose down -v   (⚠ deletes volumes — loses DB + Redis data)

services:

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: cpr-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinic_db
      MYSQL_USER: cpr_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
#    ports:
      # Expose on host so you can connect with external DB tools if needed.
      # Remove or comment out if you don't need host-level access.
      #      - "3306:3306"

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: cpr-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Redis append-only file + RDB snapshots enabled by default — data and
    # cached sessions survive container restarts.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Django / Gunicorn ────────────────────────────────────────────────────
  web:
    build: .
    container_name: cpr-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"  # Internal only — nginx proxies to this port
    volumes:
      - media_data:/app/media
      - staticfiles_data:/app/staticfiles
      - .:/app
    # Run collectstatic on every start so the shared staticfiles volume is
    # populated, then start Gunicorn.
    command: bash -c "python manage.py collectstatic --noinput --clear && gunicorn main.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  # ── Nginx (reverse proxy + static/media server) ──────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: cpr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web

volumes:
  db_data:
    name: cpr-db-data
  redis_data:
    name: cpr-redis-data
  media_data:
    name: cpr-media-data
  staticfiles_data:
    name: cpr-staticfiles-data
